# Push a tag like v1.2.0 (after setting VERSION, codex/VERSION and site/version.json to 1.2.0)
# and this builds both zips and publishes them as a GitHub release. The download page links to
# releases/latest, and updater.py downloads the zip of the exact version.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versions match the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          test "$(cat VERSION)" = "$v"
          test "$(cat codex/VERSION)" = "$v"
          python3 -c "import json,sys; assert json.load(open('site/version.json'))['version'] == sys.argv[1]" "$v"
          cmp updater.py codex/updater.py
      - name: Tests
        run: cd codex && python3 -m unittest -v
      - name: Build zips
        run: python3 build_release.py dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Token Mileage $GITHUB_REF_NAME" --notes-from-tag
