name: Check meters and Chrome extension
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s codex -v
      - run: node chrome-extension/tests.cjs
      - run: node chrome-extension/verify-integrity.cjs
      - run: python build_release.py dist
